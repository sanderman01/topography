# Hydrology v3 water table (legend topography terrain-v3), read by `topography world water`
# and Python (`topography_training.water.table`). Per class: the lake-to-catchment ratio
# r ≈ P/E (a depression stands where its lake area equals Σ r over its catchment's cells,
# with upstream overflow; r >= 1 fills to the spill, r = 0 stays dry) and `hot_dry` (an
# inland basin below 0 m far from the sea may keep a lake below sea level, owner ruling
# 2026-11-06). Without a level `climate`, lake supply ignores the moisture field, which
# drives only Q; with one (1 m), r is P/E at mean rain and scales with the cell's rain.
# Classes missing here take class 0. Judgment values 2026-11-05 (r) and 2026-11-07 (hot_dry, levels).
schema_version = 3
kind = "water_table"
legend = "topography terrain-v3"
# Game settings: standing water is a labelled lake from this area (smaller: a pond), as
# well as 0.3 m deep; Q (km² at mean rain) to m³/s for channel sizes.
lake_min_m2 = 2000.0
m3s_per_km2 = 0.56
# A basin below 0 m keeps a lake below sea level only in a hot_dry class at least this far
# from open sea (ruling B13); elsewhere the coastal water table holds it at 0 m or more.
below_sea_coast_km = 5.0

# Per level (grid spacing in m): river start (km² at mean rain), deepest breach cut, the
# steepest changed cell for the `walls` figure and the taper angle (max(wall_deg, raw)).
[levels.1]
river_km2 = 0.05
breach_cap_m = 2.0
wall_deg = 40.0
# Climate from the 128 m moisture field (owner ruling 2026-11-11; judgement values):
# lake supply = r x rain / mean land rain; Q = runoff, max(rain/mean - runoff_threshold, 0)
# / (1 - runoff_threshold); a lake cell evaporates evap_dry x a humid one's at moisture <=
# moist_dry, 1x at >= moist_wet, linear between. Cold cells (snow-ice.u8 snow/ice, glacier
# class 10, or anywhere in a cold_block_m block with at least cold_share snow/ice: steep
# rock sheds its snow but is just as cold) get precipitation as snow: they give only
# meltwater, snow_melt x min(runoff, 1) and likewise for lake supply (melt follows warmth,
# not snowfall), so snowfields start few, small streams. Standing water whose cells, or whose shore ring, are more than ice_share cold
# is ice. Coarse levels keep the plain model.
[levels.1.climate]
runoff_threshold = 0.35  # the lee (moisture < 0.11, rain < 0.35 x mean) makes no runoff
evap_dry = 8.0           # hot desert lake (~2.5 m/yr) against a humid one (~0.3 m/yr)
moist_dry = 0.1          # desert regions sit at 0.06 to 0.09
moist_wet = 0.25         # land mean is 0.30; windward regions 0.4 to 0.8
ice_share = 0.5
snow_melt = 0.05         # a stream needs ~1 km² of snowfield (river_km2 / snow_melt)
cold_block_m = 128.0     # rock ribs and cliffs in a snowfield are tens of metres across
cold_share = 0.25        # patchy snow still means a cold climate

[levels.4]
river_km2 = 0.5
breach_cap_m = 5.0
wall_deg = 35.0
# Erosion (rulings B2-B7): `routings` model runs, each followed by one implicit stream-power
# step (F = k_dt·A^m / L, A in m², n = 1) and one mass-conserving diffusion step (alpha per
# routing); cuts tapered to wall_deg. Caps are below the breached ground. Interior cells
# (real GLO-30 piece interiors, glaciers) take interior_k × k_dt, no diffusion, and their cap.
[levels.4.erosion]
routings = 2
k_dt = 8.75e-5  # probe squares: every k passed; planned value kept
m = 0.5
diffusion = 0.05
cap_m = 10.0
interior_k = 0.05
interior_cap_m = 3.0

[levels.32]
river_km2 = 10.0
breach_cap_m = 20.0
wall_deg = 35.0
[levels.32.erosion]
routings = 5
k_dt = 7e-4
m = 0.5
diffusion = 0.006  # 0.05 × (k_dt ratio 8) × (4 / 32)²: the 4 m hillslope rate at 32 m
cap_m = 30.0
interior_k = 0.05
interior_cap_m = 3.0

[classes.0]  # unlabelled
r = 1.0
[classes.1]  # doline, pinnacle and plateau karst (drains underground: dolines stay dry)
r = 0.02
[classes.2]  # gorges and slot-like canyons
r = 0.1
hot_dry = true
[classes.3]  # fjords and glacial troughs
r = 3.0
[classes.4]  # volcanic calderas and craters
r = 1.0
[classes.5]  # archipelagos, rias and skerries
r = 2.0
[classes.6]  # alpine ridges and cirques
r = 3.0
[classes.7]  # badlands, mesas and eroded gullies (arid: dry hollows)
r = 0.0
hot_dry = true
[classes.8]  # star and mountain dunes (interdune hollows stay dry)
r = 0.0
hot_dry = true
[classes.9]  # braided river basins and floodplains
r = 2.0
[classes.10]  # glaciers and ice fields
r = 1.0
[classes.11]  # stratovolcanoes (porous)
r = 0.5
[classes.12]  # coastal cliffs and sea stacks
r = 1.5
[classes.13]  # layered plateau canyons (2)
r = 0.05
hot_dry = true
[classes.14]  # cone and tower karst (1, drains underground)
r = 0.02
[classes.15]  # drowned tower karst (5, drains underground)
r = 0.02
[classes.16]  # crest-train dunes (8)
r = 0.0
hot_dry = true
[classes.17]  # cinder cones and lava fields (11, porous)
r = 0.03
[classes.18]  # plain and rolling ground (0)
r = 1.0
[classes.19]  # Grand Canyon (2)
r = 0.05
hot_dry = true
