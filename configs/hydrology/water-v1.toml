# Water amounts per terrain class (legend topography terrain-v3), read by
# `topography world hydrology` and the Python cascade (`hydrology.WATER`). Judgment values from
# the inland water share of the real context regions, 2026-10-03.
#
# lake_share:   share of the class's land kept as lakes (largest depressions by volume)
# tarn_share:   share kept as small compact lakes at 4 m (from 2 m spacing)
# dry_share:    share kept as closed dry basins (dolines, craters, interdune hollows)
# Classes missing here take class 0.
schema_version = 1
kind = "water_table"
legend = "topography terrain-v3"

[classes.0]  # unlabelled
lake_share = 0.010
tarn_share = 0.002
dry_share = 0.0

