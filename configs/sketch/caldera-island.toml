# Procedural 32 km island around an ice-capped caldera; draft layout for review.
# Positions are metres from the north-west corner: x east, y south. Features apply in
# order; later ones override the class of earlier ones. Prevailing wind from the west:
# fjords, forests and low snowline windward, dunes and badlands in the lee.
schema_version = 1
name = "caldera-island"
seed = 20260929
extent_m = 32768
default_class = 0
wind_from_deg = 270
windward_snowline_m = 1500
lee_snowline_m = 1900
treeline_m = 900

[island]
center = [16384, 16384]
radius_m = 13000
coast_noise_m = 1800
lowland_m = 40
hills_m = 260
shelf_m = -45

# Ice cap over the caldera; the caldera after it keeps class 4 in the crater.
[[features]]
kind = "glacier"
at = [16400, 15800]
radii_m = [3700, 3700]

# Central volcano: 2.5 km rim, 2.2 km crater filled with ice. Flanks are class 11.
[[features]]
kind = "caldera"
at = [16400, 15800]
radii_m = [7500, 7500]
height_m = 2300
crater_radius_m = 2200
crater_floor_m = 1850

# Windward alpine range along the west and a smaller northern spur.
