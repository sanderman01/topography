# Public snow/ice and vegetation sources for `topography cover draft`.
# Every value is a draft pilot choice, not an accepted tolerance.
schema_version = 1
policy = "public_cover_draft_v1"
status = "draft"
# Context around the review window so boundary bands see neighbouring cells.
buffer_m = 100.0
# Each captured evidence file must fit the automatic-profile evidence limit.
max_evidence_bytes = 1048576
# Seasonal snow needs a DEM date interval no longer than this.
max_acquisition_span_days = 31

[worldcover]
# Public COG, read by HTTPS range requests (same object as /vsis3/esa-worldcover/).
url_template = "https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_{tile}_Map.tif"
observed_at = "2021"
# Valid classes; 0 and anything else stays unknown.
classes = [10, 20, 30, 40, 50, 60, 70, 80, 90, 95, 100]
snow_ice_present = [70]
vegetation_present = [10, 20, 30, 40, 90, 95, 100]
vegetation_absent = [50, 60, 70, 80]
# Two 10 m pixels; cells this close to a class change become unknown.
snow_ice_band_m = 20.0
# Vegetation is optional; coarse 10 m classes are kept without a band.
vegetation_band_m = 0.0
max_crop_cells = 4194304
license = "CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/)"
citation = "ESA WorldCover project 2021 / Contains modified Copernicus Sentinel data (2021) processed by ESA WorldCover consortium. Zanaga, D. et al. (2022) ESA WorldCover 10 m 2021 v200, doi:10.5281/zenodo.7254221"

[glims]
endpoint = "https://www.glims.org/geoserver/ows"
type_name = "GLIMS:GLIMS_Glacier_Outlines"
line_types = ["glac_bound"]
accepted_status = ["okay"]
# Older outlines are historical reconstructions (e.g. Little Ice Age), not current ice.
reconstruction_before_year = 1900
# The nearest outline further than this from the DEM date becomes unknown.
max_date_offset_years = 5.0
band_m = 30.0
license = "GLIMS data are freely available; citation of the GLIMS Glacier Database is required"
citation = "GLIMS Consortium (2005, updated 2018). GLIMS Glacier Database, Version 1. Boulder, Colorado USA. NSIDC: National Snow and Ice Data Center. doi:10.7265/N5V98602 (NSIDC-0272)"

[sentinel2]
stac_endpoint = "https://earth-search.aws.element84.com/v1"
collection = "sentinel-2-c1-l2a"
asset = "scl"
window_days = 15
max_items = 50
max_scenes = 12
resolution_m = 20.0
# Scene classification: 11 snow; 2,4,5,6,7 clear ground; others unknown.
snow = [11]
clear = [2, 4, 5, 6, 7]
unknown = [0, 1, 3, 8, 9, 10]
# Two 20 m pixels.
band_m = 40.0
license = "Copernicus Sentinel data terms: free, full and open access (https://sentinels.copernicus.eu/documents/247904/690755/Sentinel_Data_Legal_Notice)"
citation = "Contains modified Copernicus Sentinel data processed by ESA; accessed through Earth Search by Element 84 (https://earth-search.aws.element84.com/v1)"
