# Fujix: a 64 km island collaged from real GLO-30 regions (docs/plans/fujix-v1.md).
# Positions are metres from the north-west corner, x east, y south; rotations clockwise.
schema_version = 2
kind = "world_layout"
name = "fujix"
extent_m = 65536
hemisphere = "north"
wind_from_deg = 225
snowline_windward_m = 1600
snowline_lee_m = 2100
