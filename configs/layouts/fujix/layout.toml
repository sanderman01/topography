# Fujix: a 64 km island collaged from real GLO-30 regions (docs/plans/fujix-v1.md).
# Positions are metres from the north-west corner, x east, y south; rotations clockwise.
schema_version = 2
kind = "world_layout"
name = "fujix"
extent_m = 65536
hemisphere = "north"
wind_from_deg = 225
snowline_windward_m = 1600
snowline_lee_m = 2100
treeline_m = 1000
coast_margin_m = 4000
seabed_edge_m = -200

[flight]
clearance_m = 200
bands = [
  { name = "low", top_m = 1500 },
  { name = "middle", top_m = 2500 },
  { name = "high", top_m = 3700 },
  { name = "top", top_m = 4500 },
]

