floor_m = -40
summit_m = 600
relief_m = 300  # towers 100-400 m, one landmark tower 550 m
coast = "towers on the shore and standing in the sea"
cover = "dense forest on tower tops and slopes, bare cliffs"
transitions = { volcano = "sharp, lava front on limestone", alpine = "gradual, 1 km", badlands = "sharp, SE arm crest" }

[[regions]]
id = "alpine"
name = "South-west alpine arm"
