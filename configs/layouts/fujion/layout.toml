floor_m = 0
summit_m = 900
relief_m = 300
coast = "eroded bluffs 100-300 m"
cover = "bare ground, sparse scrub in washes"
transitions = { volcano = "gradual, 2 km", rift = "lava flows over the badlands", karst = "sharp, SE arm crest" }

[[regions]]
id = "karst"
name = "Drowned karst bay"
class_id = 1
refs = ["ha-long-bay", "yangshuo"]
outline = [[11800, 28200], [14200, 25600], [17500, 25000], [20800, 24600], [24500, 22600],
           [28800, 22300], [29200, 26000], [29000, 31500], [12000, 31500]]
