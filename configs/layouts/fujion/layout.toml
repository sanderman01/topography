floor_m = 0
summit_m = 2600
relief_m = 1500
coast = "cliffed headland at the arm tip"
cover = "forest low, bare rock, glaciers and snow above 1,600 m"
transitions = { volcano = "sharp, high saddle", fjords = "sharp, arm crest", karst = "gradual, 1 km" }

[[regions]]
id = "rift"
