id = "volcano"
name = "Fujion"
class_id = 11
refs = ["fuji", "teide"]
center = [14900, 17400]
radius_m = 8000
target_km2 = 200
relief_m = 300
forest = 0.6
cover = "forest on the lower flanks, bare scoria, ice on the upper cone"

[[regions]]
id = "fjords"
