# Fujion: layout spec v1, rendered to L0 by `topography world layout`.
# See brief.md for intent and layout.md for a readable summary.
# Positions are metres from the north-west corner: x east, y south.
# Regions set classes in order (later override earlier) and a ground surface that runs
# from `ground_m[0]` at the coast to `ground_m[1]` at `ramp_m` inland; neighbours blend.
# Ridges and features then raise or carve that surface. `relief_m` is local relief at
# the 2 km envelope scale on top of it. `refs` name GLO-30 context regions.
schema_version = 1
name = "fujion"
extent_m = 32768
wind_from_deg = 225
windward_snowline_m = 1600
lee_snowline_m = 2100
treeline_m = 1000
height_budget_m = [-200, 3776]
# Land no region claims: the volcano's lava apron.
default_class = 11

[sea]
# Short shelf, then down toward the map edge; coarse only.
shelf_m = -40
edge_m = -200

[island]
target_km2 = 670
coast = [
  [3300, 5500], [5700, 3700], [9100, 3200], [13300, 2600], [17900, 2500],
  [21600, 2200], [23900, 2000], [27100, 2700], [29800, 3600], [30600, 5900],
  [30300, 9600], [30000, 12800], [29400, 16000], [29800, 19300], [28900, 22000],
  [28700, 26200], [28000, 29400], [26200, 29800], [24800, 28700], [22500, 27100],
  [19700, 26000], [17000, 25700], [14700, 26900], [12400, 28500], [9100, 29800],
  [4500, 29600], [3000, 28000], [4100, 25700], [4800, 23900], [4200, 22500],
  [2400, 20200], [3000, 17900], [2000, 15600], [2800, 12800], [2700, 10100],
  [2400, 7300],
]

[tiers]
starter_ceiling_m = 1500
mid_ceiling_m = 3000
clearance_m = 100

# ---------------------------------------------------------------- regions

# First, so neighbouring regions take its outer flanks. No ground of its own: the
# cone stands on its neighbours' ground.
