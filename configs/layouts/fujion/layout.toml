# Fujion: draft layout spec (world-layout-spec-v1, format not yet validated by tools).
# See brief.md for intent and layout.md for a readable summary.
# Positions are metres from the north-west corner: x east, y south.
# Regions apply in order; later regions override the class of earlier ones.
# `refs` name GLO-30 context regions (catalog/plans/context-regions-v1.toml).
# Heights: floor and summit of the envelope, relief = typical local relief.
schema_version = 1
name = "fujion"
extent_m = 32768
sea_level_m = 0
wind_from_deg = 225
windward_snowline_m = 1600
lee_snowline_m = 2100
treeline_m = 1000
height_budget_m = [-200, 3776]
# Land no region claims: the volcano's lava apron.
default_class = 11

[sea]
# Short shelf, then down to the map edge; coarse only (GEBCO-like).
shelf_m = -40
edge_m = -200

[island]
target_km2 = 670
# Clockwise from the Na Pali arm; about 670 km².
coast = [
  [3300, 5500], [5700, 3700], [9100, 3200], [13300, 2600], [17900, 2500],
  [21600, 2200], [23900, 2000], [27100, 2700], [29800, 3600], [30600, 5900],
  [30300, 9600], [30000, 12800], [29400, 16000], [29800, 19300], [28900, 22000],
  [28700, 26200], [28000, 29400], [26200, 29800], [24800, 28700], [22500, 27100],
  [19700, 26000], [17000, 25700], [14700, 26900], [12400, 28500], [9100, 29800],
  [4500, 29600], [3000, 28000], [4100, 25700], [4800, 23900], [4200, 22500],
  [2400, 20200], [3000, 17900], [2000, 15600], [2800, 12800], [2700, 10100],
  [2400, 7300],
]

# ---------------------------------------------------------------- regions

# First, so neighbouring regions take its outer flanks.
[[regions]]
id = "volcano"
name = "Fujion"
class_id = 11
refs = ["fuji", "teide"]
center = [14900, 17400]
radius_m = 8000
target_km2 = 200
floor_m = 200
summit_m = 3776
relief_m = 3500
cover = "forest on the lower flanks, bare scoria, ice above about 2,600 m windward and 2,900 m lee"


[[regions]]
id = "fjords"
name = "Windward fjords"
class_id = 3
refs = ["milford-sound", "doubtful-sound"]
outline = [[1000, 11500], [4100, 12000], [8000, 13200], [9000, 15000], [9200, 19000],
           [8600, 20800], [7200, 23000], [4800, 23900], [1000, 23500]]
target_km2 = 90  # includes the bay; overrides the cone's outer west flank
floor_m = -150
summit_m = 1600
relief_m = 1000
coast = "fjord mouths with skerries"
cover = "dense forest below the treeline, bare rock and snow above"
transitions = { volcano = "gradual, 2 km", alpine = "sharp, arm crest", napali = "gradual, 1 km" }

[[regions]]
id = "napali"
name = "Na Pali arm"
class_id = 12
refs = ["na-pali", "madeira"]
outline = [[1800, 5000], [5600, 2600], [8800, 3000], [11200, 9000], [10600, 12600],
           [8000, 13200], [4200, 12700], [2000, 9500]]
target_km2 = 70
floor_m = 0
summit_m = 1200
relief_m = 800
coast = "sheer cliffs 500-1,000 m, sea stacks, small beaches at valley mouths"
cover = "dense forest and scrub on ridges, bare cliff faces"
transitions = { plateau = "gradual, 2 km; wet to dry", fjords = "gradual, 1 km" }

[[regions]]
id = "plateau"
name = "Canyon plateau"
class_id = 2
refs = ["fish-river-canyon", "canyonlands"]
outline = [[8800, 3000], [13300, 2400], [17900, 2300], [22800, 1900], [23100, 4300],
           [21800, 7000], [23800, 8600], [21500, 10500], [18500, 9800], [16000, 9800],
           [12500, 10200], [11200, 9000]]
target_km2 = 90
floor_m = 0
summit_m = 1100  # rim falls from 1,100 m at the volcano's foot to 700 m at the coast
relief_m = 600
coast = "plateau bluffs 300-600 m, the delta at the canyon mouth"
cover = "sparse scrub, bare rock"
transitions = { volcano = "gradual, lava apron 2 km", dunes = "gradual, 1 km", napali = "gradual, 2 km" }

[[regions]]
id = "badlands"
name = "Eastern badlands and mesas"
class_id = 7
refs = ["badlands-sd", "bardenas-reales", "monument-valley"]
outline = [[23200, 11500], [26500, 9800], [30000, 10500], [29400, 16000], [29500, 19500],
           [28800, 22300], [24500, 22600], [22300, 21000], [22700, 16000]]
