[workspace]
members = ["crates/topography-cli", "crates/topography-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
topography-core = { path = "crates/topography-core" }
serde = { version = "=1.0.228", features = ["derive"] }
toml = { version = "=1.1.2", default-features = false, features = ["std", "serde", "parse", "display"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tempfile = "=3.24.0"

[workspace.lints.rust]
unsafe_code = "forbid"
