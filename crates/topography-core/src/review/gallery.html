<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Terrain library</title>
<style>
:root{color-scheme:dark;font:15px system-ui,sans-serif;background:#111917;color:#e6eee8;--line:#34453d;--muted:#a0b2a7;--green:#9edaac}*{box-sizing:border-box}body{margin:0}button,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:7px;background:#223129;color:inherit;padding:9px 14px}button:hover{border-color:var(--green)}button:focus-visible,select:focus-visible{outline:3px solid var(--green);outline-offset:2px}button:disabled{opacity:.45;cursor:default}header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:21px;margin:0 0 5px}p{margin:0;color:var(--muted);font-size:13px}#counts{font-variant-numeric:tabular-nums}main{display:grid;grid-template-columns:minmax(260px,30%) 1fr;height:calc(100vh - 87px)}aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.filter{padding:14px;display:flex;justify-content:space-between;align-items:center}select{background:#223129;color:inherit;border:1px solid var(--line);border-radius:5px;padding:7px}#tiles{padding:0 14px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;overflow:auto;align-content:start;grid-auto-rows:max-content}.tile{padding:0;overflow:hidden;text-align:left;background:#19271f;position:relative}.tile[aria-current=true]{outline:2px solid var(--green);outline-offset:1px}.tile img{width:100%;height:110px;object-fit:cover;display:block;background:#34483b}.tile .name{display:block;padding:8px 9px 3px;font-size:13px;font-weight:600}.tile .state{display:block;padding:0 9px 9px;font-size:12px;color:var(--muted)}.tile[data-decision=accept] .state{color:#a6e8b0}.tile[data-decision=reject] .state{color:#f0b6a5}article{display:flex;flex-direction:column;min-width:0;min-height:0}.toolbar{padding:14px 20px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}.identity{margin-right:auto}h2{font-size:17px;margin:0 0 4px}#yes{background:#afd9b6;color:#14251a;border-color:#afd9b6;font-weight:700}#no{background:#573b33;border-color:#986a5a}kbd{font:11px monospace;opacity:.75;margin-left:5px}iframe{width:100%;flex:1;border:0;background:#111917;min-height:280px}footer{padding:12px 20px;border-top:1px solid var(--line);min-height:58px}#message{color:var(--green);margin-bottom:5px}#message.error{color:#ffbfae}#empty{padding:35px;text-align:center;color:var(--muted)}[hidden]{display:none!important}@media(max-width:800px){main{grid-template-columns:210px 1fr}.toolbar{padding:10px}.identity{width:100%}header{padding:12px}#tiles{grid-template-columns:1fr}kbd{display:none}}@media(max-width:550px){main{display:flex;flex-direction:column;height:auto}aside{max-height:230px;border-right:0}#tiles{grid-template-columns:repeat(2,1fr)}article{height:75vh}header{align-items:start}#counts{max-width:130px}}
</style></head><body>
<header><div><h1 id="title">Terrain library</h1><p>Inspect the whole tile. Choose Yes or No; your choice saves immediately.</p></div><p id="counts" aria-live="polite"></p></header>
<main><aside><div class="filter"><label for="filter">Show</label><select id="filter"><option value="pending">To review</option><option value="all">All tiles</option><option value="accept">Accepted</option><option value="reject">Rejected</option></select></div><div id="tiles"></div><p id="empty" hidden>No tiles in this view.</p></aside>
<article><div class="toolbar"><div class="identity"><h2 id="tile-title">Select a tile</h2><p id="tile-state"></p><p id="preparation-detail" aria-live="polite"></p></div><button id="previous" aria-label="Previous tile">←</button><button id="next" aria-label="Next tile">→</button><button id="no">No <kbd>N</kbd></button><button id="yes">Yes <kbd>Y</kbd></button></div>
<iframe id="preview" title="Terrain inspector" sandbox="allow-scripts"></iframe>
<footer><p id="message" role="status" aria-live="polite">Loading saved decisions…</p><p>Use the terrain view’s overhead, profile and perspective controls. Arrow keys browse; Y/N save and advance. Rejected data is kept.</p></footer></article></main>
<script>
'use strict';
const CONFIG=__GALLERY_CONFIG__;
const byId=id=>document.getElementById(id), filter=byId('filter'), frame=byId('preview');
let state={tiles:[]},active=null,busy=false,ready=false,revision=0;
const labels={pending:'To review',accept:'Accepted',reject:'Rejected'};
const preparationLabels={checking:'Checking',awaiting_acceptance:'Checks complete',preparing:'Preparing',ready:'Ready',assessment_pending:'Surface assessment pending',needs_attention:'Needs technical attention',not_selected:'Not selected'};
function tileLabel(tile){const preparation=tile.preparation?.state;return `${labels[tile.decision]}${preparation&&tile.decision!=='reject'?' · '+(preparationLabels[preparation]||preparation):''}`;}
function identity(){const tile=state.tiles.find(t=>t.index===active);if(!tile)return;byId('tile-state').textContent=`${tileLabel(tile)} · Tile ${tile.index+1} of ${state.tiles.length}`;byId('preparation-detail').textContent=tile.preparation?.message||'';}
function visible(){return state.tiles.filter(t=>filter.value==='all'||t.decision===filter.value);}
function message(text,error=false){byId('message').textContent=text;byId('message').classList.toggle('error',error);}
function controls(){for(const id of ['yes','no','previous','next'])byId(id).disabled=busy||active===null||(['yes','no'].includes(id)&&!ready);filter.disabled=busy;}
function draw(){
 const counts={pending:0,accept:0,reject:0};for(const tile of state.tiles)counts[tile.decision]++;
 byId('title').textContent=state.title;byId('counts').textContent=`${counts.pending} to review · ${counts.accept} accepted · ${counts.reject} rejected`;
 const list=byId('tiles');list.replaceChildren();const tiles=visible();byId('empty').hidden=tiles.length>0;
 for(const tile of tiles){const button=document.createElement('button');button.className='tile';button.dataset.decision=tile.decision;button.setAttribute('aria-current',String(tile.index===active));button.setAttribute('aria-label',`${tile.title}: ${tileLabel(tile)}`);
 const img=document.createElement('img');img.loading='lazy';img.src=`/thumb/${tile.index}`;img.alt='';
 const name=document.createElement('span');name.className='name';name.textContent=tile.title;
 const status=document.createElement('span');status.className='state';status.textContent=tileLabel(tile);button.append(img,name,status);button.onclick=()=>select(tile.index);list.append(button);}
 identity();controls();
}
function select(index){if(busy)return;active=index;ready=false;const tile=state.tiles.find(t=>t.index===index);if(!tile){active=null;frame.removeAttribute('src');byId('tile-title').textContent='No tile selected';byId('tile-state').textContent='Choose another filter to browse saved decisions.';byId('preparation-detail').textContent='';}else{byId('tile-title').textContent=tile.title;byId('tile-state').textContent=`${labels[tile.decision]} · Tile ${tile.index+1} of ${state.tiles.length}`;frame.src=`/preview/${index}`;}draw();}
function move(step){if(busy)return;const tiles=visible();if(!tiles.length)return;const i=tiles.findIndex(t=>t.index===active);select(tiles[(i+step+tiles.length)%tiles.length].index);}
async function refresh(initial=false){const revisionAtStart=revision;const response=await fetch('/api/tiles',{cache:'no-store'});if(!response.ok)throw Error('Could not load saved decisions.');const updated=await response.json();if((busy&&!initial)||revisionAtStart!==revision)return;if(!initial&&JSON.stringify(updated)===JSON.stringify(state))return;state=updated;if(initial){if(!state.tiles.some(t=>t.decision==='pending'))filter.value='all';select(visible()[0]?.index??null);}else draw();}
async function vote(decision){if(busy||active===null||!ready)return;const tile=state.tiles.find(t=>t.index===active);const index=active;revision++;busy=true;controls();message('Saving…');try{
 const response=await fetch('/api/decision',{method:'POST',headers:{'Content-Type':'application/json','X-Topography-Token':CONFIG.token},body:JSON.stringify({index,gallery_sha256:state.gallery_sha256,review_sha256:tile.review_sha256,previous_record_sha256:tile.head,decision})});
 const result=await response.json();if(!response.ok)throw Error(result.error||'Choice was not saved.');Object.assign(tile,result);busy=false;const tiles=visible();select(tiles.find(t=>t.index>index)?.index??tiles[0]?.index??null);message(`Saved ${decision==='accept'?'Yes':'No'} for ${tile.title}.`);
 }catch(error){busy=false;try{await refresh();select(index);}catch{}message(`${error.message} No automatic retry; inspect the current choice before trying again.`,true);}finally{busy=false;controls();}}
function key(event){if(event.repeat||event.ctrlKey||event.altKey||event.metaKey||['INPUT','TEXTAREA','SELECT'].includes(event.target?.tagName))return;const k=event.key.toLowerCase();if(['y','n','arrowleft','arrowright'].includes(k)){event.preventDefault();if(k==='y')vote('accept');else if(k==='n')vote('reject');else move(k==='arrowright'?1:-1);}}
byId('yes').onclick=()=>vote('accept');byId('no').onclick=()=>vote('reject');byId('previous').onclick=()=>move(-1);byId('next').onclick=()=>move(1);
filter.onchange=()=>select(visible()[0]?.index??null);addEventListener('keydown',key);
addEventListener('message',event=>{const tile=state.tiles.find(t=>t.index===active);if(event.source!==frame.contentWindow||event.origin!=='null'||!tile||event.data?.index!==active||event.data?.review!==tile.review_sha256)return;if(event.data.ready){ready=true;controls();}else if(ready&&typeof event.data.key==='string')key({key:event.data.key,preventDefault(){}});});
refresh(true).then(()=>message('Choices are saved in the local catalog. Accepted tiles prepare automatically.')).catch(error=>message(error.message,true));
let polling=false;setInterval(async()=>{if(busy||polling||document.hidden)return;polling=true;try{await refresh();}catch{message('Could not refresh preparation status. Your saved choices are retained.',true);}finally{polling=false;}},2000);
</script></body></html>
