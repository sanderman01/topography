<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Context regions</title>
<style>
:root{color-scheme:dark;font:15px system-ui,sans-serif;background:#111917;color:#e6eee8;--line:#34453d;--muted:#a0b2a7;--green:#9edaac}*{box-sizing:border-box}body{margin:0}
button,select{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:7px;background:#223129;color:inherit;padding:8px 13px}button:hover{border-color:var(--green)}
header{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:20px;margin:0}p{margin:0;color:var(--muted);font-size:13px}
main{display:grid;grid-template-columns:minmax(260px,28%) 1fr;height:calc(100vh - 62px)}aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.filter{padding:12px;display:flex;justify-content:space-between;align-items:center}#list{padding:0 12px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;overflow:auto;align-content:start}
.tile{padding:0;overflow:hidden;text-align:left;background:#19271f}.tile[aria-current=true]{outline:2px solid var(--green)}.tile img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#34483b}
.tile b{display:block;padding:6px 8px 2px;font-size:13px}.tile span{display:block;padding:0 8px 8px;font-size:12px;color:var(--muted)}.tile[data-d=yes] span{color:#a6e8b0}.tile[data-d=no] span{color:#f0b6a5}
article{display:flex;flex-direction:column;min-width:0;min-height:0}.toolbar{padding:12px 18px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}.identity{margin-right:auto}h2{font-size:17px;margin:0 0 3px}
#yes{background:#afd9b6;color:#14251a;border-color:#afd9b6;font-weight:700}#no{background:#573b33;border-color:#986a5a}kbd{font:11px monospace;opacity:.75;margin-left:5px}a{color:var(--green)}
.overlays{padding:0 18px 8px;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}.overlays button{padding:4px 9px;font-size:13px}.overlays button[aria-pressed=true]{background:#2f5a3f;border-color:var(--green);color:#fff}
iframe{width:100%;flex:1;border:0;min-height:280px}footer{padding:10px 18px;border-top:1px solid var(--line);min-height:40px}#message.error{color:#ffbfae}
</style>
<header><div><h1>Context regions</h1><p>GLO-30 at 32 m. Yes admits a region to coarse-level training; No leaves it out.</p></div><p id="counts"></p></header>
<main><aside><div class="filter"><label>Show <select id="filter"><option value="pending">Pending</option><option value="yes">Yes</option><option value="no">No</option><option value="all">All</option></select></label></div><div id="list"></div></aside>
<article><div class="toolbar"><div class="identity"><h2 id="name"></h2><p id="facts"></p></div><button id="no">No<kbd>N</kbd></button><button id="yes">Yes<kbd>Y</kbd></button></div>
<div class="overlays">Overlay <button data-layer="water" aria-pressed="false">Water</button><button data-layer="snow_ice" aria-pressed="false">Snow/ice</button><button data-layer="vegetation" aria-pressed="false">Vegetation</button></div>
<iframe id="frame" title="Region inspector" sandbox="allow-scripts"></iframe><footer><p id="message"></p></footer></article></main>
<script id="config" type="application/json">__CONFIG__</script>
<script>
'use strict';
const config=JSON.parse(document.getElementById('config').textContent),byId=id=>document.getElementById(id),frame=byId('frame');
let regions=[],active=null,ready=false,overlay=null;const layers={water:false,snow_ice:false,vegetation:false};
const label=d=>d==='yes'?'Yes':d==='no'?'No':'Pending';
const message=(text,error)=>{byId('message').textContent=text;byId('message').className=error?'error':'';};
function visible(){const f=byId('filter').value;return regions.filter(r=>f==='all'||(f==='pending'?!r.decision:r.decision===f));}
function list(){const shown=visible(),box=byId('list');box.replaceChildren(...shown.map(r=>{const b=document.createElement('button');b.className='tile';b.dataset.d=r.decision||'';b.setAttribute('aria-current',String(r.index===active));
 b.innerHTML=`<img loading="lazy" alt=""><b></b><span></span>`;b.querySelector('img').src=`/thumb/${r.index}`;b.querySelector('b').textContent=r.id;b.querySelector('span').textContent=`${label(r.decision)} · class ${r.class_id}`;b.onclick=()=>select(r.index);return b;}));
 const yes=regions.filter(r=>r.decision==='yes').length,no=regions.filter(r=>r.decision==='no').length;byId('counts').textContent=`${regions.length} regions · ${yes} Yes · ${no} No · ${regions.length-yes-no} pending`;}
function select(index){active=index;ready=false;overlay=null;const r=regions[index];if(!r)return;const s=r.stats||{};
 byId('name').textContent=`${r.id} — ${r.reference}`;
 const f=v=>v===undefined?'?':Math.round(v);const [lon,lat]=r.centre;
 byId('facts').innerHTML='';byId('facts').append(`Class ${r.class_id}: ${r.class||'?'} · ${r.size_km} km · land ${Math.round((s.land_share||0)*100)}% · ${f(s.min_m)}–${f(s.max_m)} m (p5–p95 ${f(s.p5_m)}–${f(s.p95_m)}) · flat ${Math.round((s.flat_share||0)*100)}% · ${label(r.decision)} · `);
 const a=document.createElement('a');a.href=`https://earth.google.com/web/@${lat.toFixed(5)},${lon.toFixed(5)},0a,${Math.round(r.size_km*2500)}d,35y,0h,0t,0r`;a.target='_blank';a.rel='noopener';a.textContent='Google Earth';byId('facts').append(a);
 frame.src=`/preview/${index}`;list();}
async function syncOverlay(){const r=regions[active];if(!r||!ready)return;for(const b of document.querySelectorAll('.overlays button'))b.setAttribute('aria-pressed',String(layers[b.dataset.layer]));
 const payload={index:r.index,review:r.region_sha256,layers:{...layers}};
 if(Object.values(layers).some(Boolean)&&!overlay){overlay='loading';const res=await fetch(`/api/overlay/${r.index}`);const body=await res.json();if(!res.ok){message(body.error,true);overlay=null;return;}overlay=body;payload.overlay=body;}
 frame.contentWindow?.postMessage(payload,'*');}
async function vote(decision){const r=regions[active];if(!r)return;
 const res=await fetch('/api/decision',{method:'POST',headers:{'Content-Type':'application/json','X-Topography-Token':config.token},body:JSON.stringify({index:r.index,region_sha256:r.region_sha256,decision})});
 const body=await res.json();if(!res.ok){message(body.error||'Vote failed.',true);return;}r.decision=decision;message(`${r.id}: ${label(decision)} saved.`);
 const next=visible().find(x=>x.index>r.index&&!x.decision)||visible().find(x=>!x.decision);next?select(next.index):list();}
function step(d){const shown=visible();if(!shown.length)return;const i=shown.findIndex(r=>r.index===active);select(shown[(i+d+shown.length)%shown.length].index);}
function key(e){if(e.key==='y')vote('yes');else if(e.key==='n')vote('no');else if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1);else return;e.preventDefault?.();}
addEventListener('keydown',e=>{if(!e.repeat&&!e.ctrlKey&&!e.altKey&&!e.metaKey&&e.target.tagName!=='SELECT')key(e);});
addEventListener('message',e=>{const r=regions[active];if(e.source!==frame.contentWindow||!r||e.data?.index!==active||e.data?.review!==r.region_sha256)return;
 if(e.data.ready){ready=true;overlay=null;syncOverlay();}else if(typeof e.data.key==='string')key({key:e.data.key});});
for(const b of document.querySelectorAll('.overlays button'))b.onclick=()=>{layers[b.dataset.layer]=!layers[b.dataset.layer];syncOverlay();};
byId('yes').onclick=()=>vote('yes');byId('no').onclick=()=>vote('no');byId('filter').onchange=()=>{list();const v=visible();if(v.length&&!v.some(r=>r.index===active))select(v[0].index);};
fetch('/api/regions').then(r=>r.json()).then(body=>{regions=body.regions;const first=regions.find(r=>!r.decision)||regions[0];first?select(first.index):list();}).catch(e=>message(e.message,true));
</script>
