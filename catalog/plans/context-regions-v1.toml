# GLO-30 context regions for the coarse cascade levels (L1 128 m, L2 32 m).
# Each region is 49,152 m square at 32 m unless extent_m says otherwise, centred on
# `center` = [lon, lat]. `class_id` labels the whole region (terrain-v2 legend);
# optional [[regions.areas]] polygons override it. Build with `topography context build`,
# vote with `topography context serve`. Changing an entry needs a new id.
schema_version = 1
name = "context-regions-v1"

