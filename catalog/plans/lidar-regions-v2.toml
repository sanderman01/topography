# Public 1 m lidar regions added for class conditioning (docs/plans/class-conditioning-v1.md):
# at least 5 training and 1 validation region per class for L3. Same format and sources
# as lidar-regions-v1.toml (USGS 3DEP, LINZ); coverage is checked on build and regions
# without a public 1 m DEM are dropped.
schema_version = 1
name = "lidar-regions-v2"
source = "lidar"

