# Public 1 m lidar averaged to 4 m for the L3 cascade level. Each region is 16,384 m
# square unless extent_m says otherwise, centred on `center` = [lon, lat]. Sources are
# USGS 3DEP 1 m and LINZ 1 m DEMs read over HTTPS; only the 4 m result is kept.
# Coverage is not guaranteed: region.json reports the surveyed share.
schema_version = 1
name = "lidar-regions-v1"
source = "lidar"

# 1 Karst
[[regions]]
id = "rio-abajo"
class_id = 1
center = [-66.68, 18.36]
reference = "Rio Abajo cone karst, Puerto Rico"

[[regions]]
id = "takaka-hill"
class_id = 1
center = [172.87, -41.03]
reference = "Takaka Hill and Canaan karst, Tasman"

