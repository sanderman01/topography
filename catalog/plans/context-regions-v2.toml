# GLO-30 context regions added for class conditioning (docs/plans/class-conditioning-v1.md):
# at least 8 training and 2 validation regions per class for L1 and L2. Same format as
# context-regions-v1.toml; build into the same regions directory. Picked for strong
# relief and clear class character; no open floodplains or mostly-water areas.
