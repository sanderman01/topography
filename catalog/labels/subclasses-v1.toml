# Legend v3 subclasses of existing sources (docs/plans/biome-forms-v1.md).
# Each class lists the GLO-30 context regions (L1, L2), reduced lidar regions (L3) and
# 1 m library tiles (L4, by title prefix) that show its look; a listed source takes
# this class whatever its release class. Unlisted sources keep their release class.
# A class trains at a level only with at least `min_sources` training sources there;
# elsewhere a painted cell uses its first trained fallback (else 0, unconditional).
# Classes 10 (ice) and 18 (plain) are also set per cell when training fields are built.
schema_version = 1
legend = "terrain-v3.toml"
min_sources = 3

