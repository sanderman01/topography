[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topography-training"
version = "0.1.0"
description = "Scalar terrain numeric evaluation behind a versioned batch interface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5"]

[project.optional-dependencies]
codec = ["diffusers==0.36.0", "safetensors==0.7.0"]
# Torch comes from the ROCm/CUDA index first; see README.
diffusion = ["diffusers==0.36.0", "safetensors==0.7.0", "pillow", "scipy==1.18.1"]

[tool.setuptools.packages.find]
where = ["src"]
