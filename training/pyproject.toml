[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topography-training"
version = "0.1.0"
description = "Scalar terrain numeric evaluation behind a versioned batch interface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5"]

[tool.setuptools.packages.find]
where = ["src"]
